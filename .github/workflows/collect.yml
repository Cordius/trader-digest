name: Collect Financial Feeds

on:
  schedule:
    - cron: '0 23 * * *' # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

concurrency:
  group: collect-group
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full collection
        run: node scripts/collect.js
        timeout-minutes: 10

      - name: Commit feed update
        env:
          COMMIT_MSG: "chore: update feed-financial.json"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-financial.json
          git diff --cached --quiet || git commit -m "$COMMIT_MSG"
          git push
